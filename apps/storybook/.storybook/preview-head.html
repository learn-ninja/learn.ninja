<!-- The app's fonts. In the app, next/font loads Inter and Geist Mono and sets these variables;
     Storybook loads the same two from Google Fonts, or font-sans and font-mono fall back to the system font. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Inter:wght@100..900&display=swap"
/>
<!-- next/link reads process.env flags; outside Next there's no process, so give it an empty one. -->
<script>
  window.process = window.process || { env: {} }
</script>
<style>
  :root {
    --font-inter: "Inter", ui-sans-serif, system-ui, sans-serif;
    --font-geist-mono: "Geist Mono", ui-monospace, monospace;
  }
</style>

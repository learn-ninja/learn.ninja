name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job only checks out, builds, tests, and uploads an artifact: it never writes to the repo.
permissions:
  contents: read

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright can't install Chromium on yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx turbo lint typecheck test build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      # Browser smoke tests against the build above (apps/web/e2e).
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -w web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
